  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: grafana-secret
    template:
      data:
        GF_SECURITY_ADMIN_PASSWORD: "{{ .adminPassword }}"
  data:
    - { secretKey: adminPassword, remoteRef: { key: fcg/grafana, property: password } }
