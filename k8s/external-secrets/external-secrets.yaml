apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fcg-shared-secret
  namespace: fcg
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: fcg-shared-secret
    template:
      data:
        Jwt__SecretKey: "{{ .jwtSecretKey }}"
        RabbitMq__Password: "{{ .rabbitPassword }}"
        AWS_ACCESS_KEY_ID: "{{ .awsAccessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .awsSecretAccessKey }}"
        AWS_REGION: us-east-1
  data:
    - { secretKey: jwtSecretKey, remoteRef: { key: fcg/jwt, property: secretKey } }
    - { secretKey: rabbitPassword, remoteRef: { key: fcg/rabbitmq, property: password } }
    - { secretKey: awsAccessKeyId, remoteRef: { key: fcg/aws-services, property: accessKeyId } }
    - { secretKey: awsSecretAccessKey, remoteRef: { key: fcg/aws-services, property: secretAccessKey } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-api-secret
  namespace: fcg
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: catalog-api-secret
    template:
      data:
        ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=fcg_catalog_db;Username=fcg;Password={{ .postgresPassword }}"
  data:
    - { secretKey: postgresPassword, remoteRef: { key: fcg/postgres, property: password } }
---
