apiVersion: v1
kind: ConfigMap
metadata:
  name: fcg-shared-config
  namespace: fcg
data:
  Jwt__Issuer: "FCG.Api"
  Jwt__Audience: "FCG.Client"
  Jwt__ExpirationMinutes: "60"
  RabbitMq__Host: "rabbitmq"
  RabbitMq__Username: "guest"
  ASPNETCORE_ENVIRONMENT: "Production"
  DOTNET_ENVIRONMENT: "Production"
