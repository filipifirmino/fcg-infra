apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: fcg
data:
  datasource.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: fcg
data:
  dashboard-provider.yml: |
    apiVersion: 1

    providers:
      - name: FCG
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
